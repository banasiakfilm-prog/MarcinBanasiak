  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Newsreader', 'Playfair Display', 'Georgia', 'serif'],

            'cinema': '0.14em',

  <style>
    /* Clean minimal scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #ffffff;
    }
    ::-webkit-scrollbar-thumb {
      background: #e2e2e2;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #c0c0c0;
    }

    .aspect-cinema {
      aspect-ratio: 2.39 / 1;
    }
    .aspect-reel {
      aspect-ratio: 16 / 9;
    }

    /* Minimalist image hover transition */
    .project-card:hover .project-thumb {
      transform: scale(1.03);
    }

    /* Slower, tasteful cinematic reveal animation */
    @keyframes cinemaFadeUp {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Smooth collapse animation */
    @keyframes cinemaFadeDown {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(18px);
      }
    }

    .cinema-reveal {
      opacity: 0;
      animation: cinemaFadeUp 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cinema-collapse {
      animation: cinemaFadeDown 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Hide scrollbar for laurels but allow swipe */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
  <!-- Vimeo Player API -->
  <script src="https://player.vimeo.com/api/player.js"></script>
